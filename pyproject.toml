[project]
name = "harness"
version = "0.24.0"
description = "Benchmark extension: inference and evaluation over the resident bundles with Harbor"
requires-python = ">=3.12"
# Harbor is the only runtime dependency the entry points import or exec. The
# closure is pinned twice from the same release: uv.lock for this project, and
# scripts/lib/harbor-requirements.lock for the hash-checked tool install.
dependencies = ["harbor==0.24.0"]

[project.scripts]
harness-infer = "tools.cli:infer"
harness-eval = "tools.cli:evaluate"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
