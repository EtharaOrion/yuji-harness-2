# squid config for judge-proxy: the JUDGE's way out, never the agent's.
#
# Loaded only by the judge-proxy service in overlay-judge.yaml (baked into the
# egress-proxy image beside squid.conf). main is not on the network judge-proxy
# listens on, so nothing here widens what the agent can reach -- squid.conf and
# its one-host allowlist are untouched.
#
# The hosts are what codex (ChatGPT login) actually needs to grade, measured by
# running the judge behind an allow-all squid and reading access.log:
#   chatgpt.com       the model (every grading call)
#   auth.openai.com   refreshing the login when its access token expires
# Measured but NOT needed, denied here and grading still succeeds:
#   ab.chatgpt.com, *.oaiusercontent.com   telemetry / assets
# scripts/tests/test_judge_container.py pins this list.

acl judge_hosts dstdomain chatgpt.com auth.openai.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT SSL_ports judge_hosts
http_access deny all

http_port 3128
access_log stdio:/var/log/squid/access.log squid
cache deny all
cache_store_log none
forwarded_for delete
pid_filename /var/run/squid/squid.pid
shutdown_lifetime 1 second
