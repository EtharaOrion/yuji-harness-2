# squid config for GLM runs (CC_MODE=zbridge) only. Opus runs never load it.
#
# Same rules as squid.conf plus one destination: zbridge on the host, on its
# port only. scripts/run_task.sh writes a copy with the real zbridge port and
# overlay-zbridge.yaml mounts that copy over squid.conf.
# test_egress_allowlist.py checks the shared lines still match squid.conf.

acl allowed_hosts dstdomain api.anthropic.com
acl zbridge_host dstdomain host.docker.internal
acl zbridge_port port 8766
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT SSL_ports allowed_hosts
http_access allow allowed_hosts
# Plain HTTP to zbridge's port. Every other port on the host stays denied.
http_access allow zbridge_host zbridge_port
http_access deny all

http_port 3128
access_log stdio:/var/log/squid/access.log squid
cache deny all
cache_store_log none
forwarded_for delete
pid_filename /var/run/squid/squid.pid
shutdown_lifetime 1 second
