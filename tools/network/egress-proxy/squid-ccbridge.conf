# squid config for OpenHands runs (AGENT=openhands) only. claude-code runs never
# load it.
#
# Same rules as squid.conf plus one destination: the ccbridge on the host, on
# its port only. That is the agent's model call -- the bridge swaps the shared
# secret for the host's Claude subscription token and forwards to
# api.anthropic.com itself. scripts/run_task.sh writes a copy with the real
# bridge port and overlay-ccbridge.yaml mounts that copy over squid.conf.
# test_egress_allowlist.py checks the shared lines still match squid.conf.

acl allowed_hosts dstdomain api.anthropic.com
acl ccbridge_host dstdomain host.docker.internal
acl ccbridge_port port 8765
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT SSL_ports allowed_hosts
http_access allow allowed_hosts
# Plain HTTP to the bridge's port. Every other port on the host stays denied.
http_access allow ccbridge_host ccbridge_port
http_access deny all

# The OpenHands SDK makes non-streaming calls, so nothing crosses the proxy
# until a whole turn is done. squid's 15-minute default would cut a long
# thinking turn the bridge and the SDK are both still waiting on (both allow
# 30, see run_task.sh ensure_claude_oauth_bridge and agent.py llm_timeout).
read_timeout 30 minutes

http_port 3128
access_log stdio:/var/log/squid/access.log squid
cache deny all
cache_store_log none
forwarded_for delete
pid_filename /var/run/squid/squid.pid
shutdown_lifetime 1 second
